<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>3z</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Crimson+Pro:ital,wght@0,300;1,300&display=swap" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════════════════
       VARIÁVEIS GLOBAIS
    ═══════════════════════════════════════════════════ */
    :root {
      /* Cores principais */
      --void:         #07090f;      /* fundo absoluto */
      --deep:         #0b0f1c;      /* fundo primário */
      --surface:      #111827;      /* superfície sutil */
      --glass:        rgba(10, 14, 26, 0.6);
      --glass-border: rgba(255, 255, 255, 0.07);
      --glass-shine:  rgba(255, 255, 255, 0.04);

      /* Acentos */
      --blue:         #104994;
      --blue-dim:     rgba(61, 126, 255, 0.18);
      --blue-glow:    rgba(61, 126, 255, 0.4);
      --white:        #e4edff;
      --muted:        rgba(180, 200, 240, 0.38);

      /* Cores das redes sociais */
      --ig-a:   #f09433;
      --ig-b:   #e6683c;
      --ig-c:   #dc2743;
      --ig-d:   #cc2366;
      --ig-e:   #bc1888;
      --tt:     #ff2d55;
      --dc:     #5865f2;

      /* Tipografia */
      --font-display: 'Outfit', sans-serif;
      --font-body:    'Crimson Pro', Georgia, serif;

      /* Misc */
      --radius-card: 26px;
      --ease:        cubic-bezier(0.23, 1, 0.32, 1);
    }

    /* ═══════════════════════════════════════════════════
       RESET
    ═══════════════════════════════════════════════════ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--void);
      font-family: var(--font-body);
      color: var(--white);
      overflow: hidden;
      cursor: none; /* cursor customizado */
    }

    /* ═══════════════════════════════════════════════════
       CURSOR PERSONALIZADO
    ═══════════════════════════════════════════════════ */
    #c-dot {
      position: fixed;
      width: 7px; height: 7px;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: background 0.2s, transform 0.15s var(--ease);
    }

    #c-ring {
      position: fixed;
      width: 34px; height: 34px;
      border: 1.5px solid var(--blue);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      /* largura/altura animadas por JS */
      transition:
        width  0.35s var(--ease),
        height 0.35s var(--ease),
        border-color 0.25s,
        background   0.25s;
    }

    /* Estado hover: anel cresce e fica colorido */
    body.is-hovering #c-ring {
      width: 58px; height: 58px;
      border-color: rgba(255,255,255,0.5);
      background: rgba(61,126,255,0.1);
    }
    body.is-hovering #c-dot {
      transform: translate(-50%, -50%) scale(0);
    }

    /* ═══════════════════════════════════════════════════
       CANVAS — CAMPO DE ESTRELAS
    ═══════════════════════════════════════════════════ */
    #stars {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* Véu de vinheta/nebulosa sobre o canvas */
    #veil {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 70% at 50% 50%,
          transparent 20%, rgba(7,9,15,0.5) 75%, var(--void) 100%),
        radial-gradient(ellipse 50% 40% at 15% 80%,
          rgba(30,55,160,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 85% 20%,
          rgba(100,30,180,0.05) 0%, transparent 70%);
    }

    /* ═══════════════════════════════════════════════════
       SPLASH SCREEN
    ═══════════════════════════════════════════════════ */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--void);
      transition: opacity 0.9s var(--ease), visibility 0.9s;
    }

    #splash.out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.2rem;
      animation: float-in 1s var(--ease) both;
    }

    @keyframes float-in {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo orbital */
    .splash-orbit {
      position: relative;
      width: 80px; height: 80px;
      display: flex; align-items: center; justify-content: center;
    }

    .orbit-ring {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 1px solid rgba(61,126,255,0.2);
      animation: spin 14s linear infinite;
    }

    .orbit-ring::after {
      content: '';
      position: absolute;
      width: 7px; height: 7px;
      background: var(--blue);
      border-radius: 50%;
      top: -3.5px;
      left: calc(50% - 3.5px);
      box-shadow: 0 0 10px var(--blue), 0 0 20px var(--blue-glow);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .orbit-core {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(61,126,255,0.3);
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle, rgba(61,126,255,0.12) 0%, transparent 70%);
      animation: pulse-core 3s ease-in-out infinite;
    }

    @keyframes pulse-core {
      0%,100% { box-shadow: 0 0 0 0 var(--blue-glow), 0 0 24px var(--blue-dim); }
      50%      { box-shadow: 0 0 0 8px transparent, 0 0 40px rgba(61,126,255,0.15); }
    }

    .orbit-core svg {
      width: 22px; height: 22px;
      fill: var(--blue);
    }

    /* Texto do splash */
    .splash-label {
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: -1rem;
    }

    .splash-name {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--white);
      text-align: center;
      line-height: 1;
    }

    /* Botão entrar */
    .btn-enter {
      cursor: none;
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--void);
      background: var(--white);
      border: none;
      border-radius: 100px;
      padding: 0.9rem 2.8rem;
      transition: transform 0.3s var(--ease), box-shadow 0.3s;
      box-shadow: 0 0 30px rgba(228,237,255,0.2);
      position: relative;
      overflow: hidden;
    }

    .btn-enter::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, transparent 60%);
    }

    .btn-enter:hover {
      transform: scale(1.06) translateY(-2px);
      box-shadow: 0 8px 40px rgba(228,237,255,0.35);
    }
    .btn-enter:active { transform: scale(0.97); }

    /* ═══════════════════════════════════════════════════
       LAYOUT PRINCIPAL
    ═══════════════════════════════════════════════════ */
    #app {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s var(--ease) 0.4s;
    }

    #app.show {
      opacity: 1;
      pointer-events: all;
    }

    /* ═══════════════════════════════════════════════════
       CARD PRINCIPAL — GLASSMORPHISM
    ═══════════════════════════════════════════════════ */
    .card {
      position: relative;
      width: min(460px, calc(100vw - 2.5rem));
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      padding: 2.8rem 2.6rem 2.4rem;
      backdrop-filter: blur(32px) saturate(1.5);
      -webkit-backdrop-filter: blur(32px) saturate(1.5);
      box-shadow:
        0 0 0 1px var(--glass-shine),
        0 40px 80px rgba(0,0,0,0.6),
        inset 0 1px 0 var(--glass-shine);
      animation: card-in 0.9s var(--ease) 0.6s both;
      /* Perspectiva 3D para parallax */
      transform-style: preserve-3d;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(28px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Linha de luz no topo do card */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 12%; right: 12%;
      height: 1px;
      background: linear-gradient(90deg,
        transparent, rgba(255,255,255,0.12) 40%,
        rgba(255,255,255,0.12) 60%, transparent);
      border-radius: 1px;
    }

    /* Reflexo difuso no canto */
    .card::after {
      content: '';
      position: absolute;
      top: -60px; right: -40px;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(61,126,255,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Avatar / Foto ── */
    .avatar-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 1.4rem;
    }

    .avatar {
      width: 76px; height: 76px;
      border-radius: 50%;
      border: 2px solid var(--glass-border);
      background:
        radial-gradient(circle at 35% 35%, rgba(61,126,255,0.35), transparent 60%),
        var(--surface);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 4px rgba(61,126,255,0.08), 0 8px 30px rgba(0,0,0,0.4);
      overflow: hidden;
      position: relative;
    }

    .avatar-mono {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1.8rem;
      color: rgba(255,255,255,0.7);
      letter-spacing: -0.03em;
      user-select: none;
    }

    /* Status online */
    .avatar::after {
      content: '';
      position: absolute;
      bottom: 5px; right: 5px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #22c55e;
      border: 2px solid var(--deep);
      box-shadow: 0 0 8px rgba(34,197,94,0.6);
    }

    /* ── Nome e Bio ── */
    .profile-name {
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--white);
      text-align: center;
      line-height: 1;
      margin-bottom: 0.35rem;
    }

    .profile-handle {
      text-align: center;
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: var(--blue);
      opacity: 0.8;
      margin-bottom: 0.75rem;
    }

    .profile-bio {
      text-align: center;
      font-size: 1rem;
      font-weight: 300;
      font-style: italic;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 0;
    }

    /* ── Divisor ── */
    .sep {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin: 1.6rem 0;
    }
    .sep-line { flex: 1; height: 1px; background: var(--glass-border); }
    .sep-dot  {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: rgba(61,126,255,0.35);
    }

    /* ═══════════════════════════════════════════════════
       BOTÕES DAS REDES SOCIAIS
    ═══════════════════════════════════════════════════ */
    .social-links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* Base do botão social */
    .soc-btn {
      cursor: none;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.03);
      text-decoration: none;
      color: var(--white);
      position: relative;
      overflow: hidden;
      transition:
        transform    0.3s var(--ease),
        border-color 0.3s,
        box-shadow   0.3s,
        background   0.3s;
    }

    .soc-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.35s;
    }

    .soc-btn:hover {
      transform: translateX(5px) scale(1.01);
    }

    .soc-btn:active {
      transform: translateX(3px) scale(0.99);
    }

    /* ── Instagram ── */
    .soc-btn.instagram:hover {
      border-color: rgba(220,39,67,0.4);
      background: rgba(220,39,67,0.07);
      box-shadow: 0 4px 24px rgba(220,39,67,0.15), inset 0 0 20px rgba(220,39,67,0.04);
    }

    .soc-btn.instagram .soc-icon {
      background: linear-gradient(135deg,
        var(--ig-a) 0%, var(--ig-b) 25%,
        var(--ig-c) 50%, var(--ig-d) 75%, var(--ig-e) 100%);
    }

    /* ── TikTok ── */
    .soc-btn.tiktok:hover {
      border-color: rgba(255,45,85,0.4);
      background: rgba(255,45,85,0.06);
      box-shadow: 0 4px 24px rgba(255,45,85,0.15), inset 0 0 20px rgba(255,45,85,0.03);
    }

    .soc-btn.tiktok .soc-icon {
      background: #010101;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    /* ── Discord ── */
    .soc-btn.discord:hover {
      border-color: rgba(88,101,242,0.5);
      background: rgba(88,101,242,0.08);
      box-shadow: 0 4px 24px rgba(88,101,242,0.2), inset 0 0 20px rgba(88,101,242,0.05);
    }

    .soc-btn.discord .soc-icon {
      background: var(--dc);
    }

    /* Ícone wrapper */
    .soc-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.3s var(--ease);
    }

    .soc-btn:hover .soc-icon {
      transform: scale(1.1) rotate(-4deg);
    }

    .soc-icon svg {
      width: 18px; height: 18px;
      fill: #fff;
    }

    /* Textos do botão */
    .soc-text {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .soc-name {
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--white);
    }

    .soc-sub {
      font-family: var(--font-display);
      font-size: 0.63rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    /* Seta no final do botão */
    .soc-arrow {
      margin-left: auto;
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 0.25s, transform 0.3s var(--ease);
      color: var(--muted);
    }

    .soc-arrow svg {
      width: 14px; height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .soc-btn:hover .soc-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    /* ═══════════════════════════════════════════════════
       RODAPÉ DO CARD
    ═══════════════════════════════════════════════════ */
    .card-footer {
      margin-top: 1.6rem;
      text-align: center;
      font-family: var(--font-display);
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(180,200,240,0.2);
    }

    /* ═══════════════════════════════════════════════════
       PLAYER DE ÁUDIO — CANTO INFERIOR DIREITO
    ═══════════════════════════════════════════════════ */
    #player {
      position: fixed;
      bottom: 1.6rem; right: 1.6rem;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.5rem 0.9rem 0.5rem 0.5rem;
      background: rgba(10, 14, 26, 0.75);
      border: 1px solid var(--glass-border);
      border-radius: 100px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.45);
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.6s var(--ease) 1.2s, transform 0.6s var(--ease) 1.2s;
    }

    #player.show {
      opacity: 1;
      transform: translateY(0);
    }

    #btn-pp {
      cursor: none;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--blue);
      border: none;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 18px var(--blue-glow);
      transition: transform 0.25s var(--ease), box-shadow 0.25s;
    }
    #btn-pp:hover {
      transform: scale(1.12);
      box-shadow: 0 0 30px rgba(61,126,255,0.7);
    }
    #btn-pp:active { transform: scale(0.95); }

    #btn-pp svg {
      width: 12px; height: 12px;
      fill: #fff;
    }

    #icon-pause { display: none; }

    .p-info {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .p-track {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--white);
      white-space: nowrap;
    }

    .p-artist {
      font-family: var(--font-display);
      font-size: 0.6rem;
      color: var(--muted);
      white-space: nowrap;
    }

    /* Barras de onda */
    .waves {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      margin-left: 2px;
    }

    .waves b {
      display: block;
      width: 2.5px;
      border-radius: 2px;
      background: var(--blue);
      opacity: 0.7;
      animation: wb 1.1s ease-in-out infinite;
    }
    .waves b:nth-child(1) { height: 35%; animation-delay: 0s; }
    .waves b:nth-child(2) { height: 85%; animation-delay: 0.18s; }
    .waves b:nth-child(3) { height: 55%; animation-delay: 0.36s; }
    .waves b:nth-child(4) { height: 95%; animation-delay: 0.09s; }
    .waves b:nth-child(5) { height: 45%; animation-delay: 0.27s; }

    @keyframes wb {
      0%,100% { transform: scaleY(0.35); }
      50%      { transform: scaleY(1); }
    }

    #player.paused .waves b {
      animation-play-state: paused;
      transform: scaleY(0.35);
    }
  </style>
</head>
<body>

  <div id="c-dot"></div>
  <div id="c-ring"></div>

  <canvas id="stars"></canvas>
  <div id="veil" aria-hidden="true"></div>

  <div id="splash" role="dialog" aria-modal="true" aria-label="Tela de entrada">
    <div class="splash-wrap">

      <div class="splash-orbit">
        <div class="orbit-ring"></div>
        <div class="orbit-core">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
          </svg>
        </div>
      </div>

      <p class="splash-label">Bem-vindo</p>
      <h1 class="splash-name">Espero que goste.</h1>

      <button class="btn-enter" id="btn-enter" aria-label="Entrar">
        Entrar
      </button>

    </div>
  </div>

  <main id="app">
    <div style="perspective: 1000px;">
      <div class="card" id="main-card">

        <div class="avatar-wrap">
          <div class="avatar" aria-label="Avatar">
            <span class="avatar-mono"></span><img src="https://i.pinimg.com/webp/736x/da/bc/01/dabc012a7e3f27cf9da7e343ff9b6bab.webp" alt="Foto" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
          </div>
        </div>

        <h2 class="profile-name">3z</h2>
        <p class="profile-handle">@knt26k</p>

        <p class="profile-bio">
          Making history, not noise
        </p>

        <div class="sep" aria-hidden="true">
          <div class="sep-line"></div>
          <div class="sep-dot"></div>
          <div class="sep-line"></div>
        </div>

        <nav class="social-links" aria-label="Redes sociais">

          <a href="https://instagram.com/knt26k" class="soc-btn instagram"
             target="_blank" rel="noopener noreferrer" aria-label="Instagram">

  <audio id="bg-audio" src="./flashing-lights.mp3" loop preload="auto"></audio>

  <script>
  'use strict';

  /* ════════════════════════════════════════════════
     1. CURSOR PERSONALIZADO
  ════════════════════════════════════════════════ */
  const cDot  = document.getElementById('c-dot');
  const cRing = document.getElementById('c-ring');
  let mx = 0, my = 0;   // posição do mouse (dot)
  let rx = 0, ry = 0;   // posição suavizada (anel)

  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    cDot.style.left = mx + 'px';
    cDot.style.top  = my + 'px';
  });

  /* Anel com interpolação linear (lerp) para suavização */
  (function lerpRing() {
    rx += (mx - rx) * 0.1;
    ry += (my - ry) * 0.1;
    cRing.style.left = rx + 'px';
    cRing.style.top  = ry + 'px';
    requestAnimationFrame(lerpRing);
  })();

  /* Cursor hover em elementos interativos */
  const CLICKABLE = 'a, button, [role="button"], input, label, select, [tabindex]';
  document.addEventListener('mouseover', e => {
    if (e.target.closest(CLICKABLE)) document.body.classList.add('is-hovering');
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest(CLICKABLE)) document.body.classList.remove('is-hovering');
  });

  /* ════════════════════════════════════════════════
     2. CAMPO DE ESTRELAS — Canvas
  ════════════════════════════════════════════════ */
  const canvas = document.getElementById('stars');
  const ctx    = canvas.getContext('2d');
  let W, H, stars = [];

  const CFG = {
    count:   260,
    maxSize: 1.7,
    speed:   0.06,
  };

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function mkStar() {
    return {
      x:   Math.random() * W,
      y:   Math.random() * H,
      r:   Math.random() * CFG.maxSize + 0.3,
      a:   Math.random() * 0.7 + 0.1,      /* alpha base */
      da:  (Math.random() * 0.006 + 0.002) * (Math.random() < 0.5 ? 1 : -1),
      dx:  (Math.random() - 0.5) * CFG.speed,
      dy:  (Math.random() - 0.5) * CFG.speed * 0.4,
      twk: Math.random() > 0.5,            /* pisca? */
    };
  }

  function buildStars() {
    stars = Array.from({ length: CFG.count }, mkStar);
  }

  function drawStars() {
    ctx.clearRect(0, 0, W, H);

    for (const s of stars) {
      /* Drift */
      s.x = (s.x + s.dx + W) % W;
      s.y = (s.y + s.dy + H) % H;

      /* Cintilação */
      if (s.twk) {
        s.a += s.da;
        if (s.a > 0.85 || s.a < 0.05) s.da *= -1;
      }

      /* Desenho */
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(210, 228, 255, ${s.a})`;
      ctx.fill();

      /* Halo para estrelas maiores */
      if (s.r > 1.1) {
        const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 2.5);
        g.addColorStop(0, `rgba(61, 126, 255, ${s.a * 0.4})`);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    requestAnimationFrame(drawStars);
  }

  window.addEventListener('resize', () => { resize(); buildStars(); });
  resize(); 
  buildStars(); 
  drawStars();

  /* ════════════════════════════════════════════════
     3. EFEITOS E INTERATIVIDADE DO CARD
  ════════════════════════════════════════════════ */
  const card = document.getElementById('main-card');
  const appContainer = document.getElementById('app');

  document.addEventListener('mousemove', (e) => {
    // Só aplica o efeito 3D se a tela de splash já sumiu
    if (!appContainer.classList.contains('show')) return;
    
    const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
    const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
    card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
  });

  document.addEventListener('mouseleave', () => {
    card.style.transform = `rotateY(0deg) rotateX(0deg)`;
  });

  /* ════════════════════════════════════════════════
     4. ÁUDIO E CONTROLE DO PLAYER LOCAL
  ════════════════════════════════════════════════ */
  const splash = document.getElementById('splash');
  const app = document.getElementById('app');
  const btnEnter = document.getElementById('btn-enter');
  const player = document.getElementById('player');
  const btnPP = document.getElementById('btn-pp');
  const iconPlay = document.getElementById('icon-play');
  const iconPause = document.getElementById('icon-pause');
  const audio = document.getElementById('bg-audio');

  let isPlaying = false;

  function togglePlay() {
    if (isPlaying) {
      audio.pause();
      player.classList.add('paused');
      iconPlay.style.display = 'block';
      iconPause.style.display = 'none';
    } else {
      audio.play();
      player.classList.remove('paused');
      iconPlay.style.display = 'none';
      iconPause.style.display = 'block';
    }
    isPlaying = !isPlaying;
  }

  // Quando clicar no botão ENTRAR
  btnEnter.addEventListener('click', () => {
    splash.classList.add('out');
    app.classList.add('show');
    player.classList.add('show');
    
    // Ajustar volume do MP3
    audio.volume = 0.5; // Toca em 50% para não assustar
    
    // Forçar a primeira reprodução do áudio
    togglePlay();
  });

  // Botão de Play/Pause flutuante
  btnPP.addEventListener('click', togglePlay);

  </script>
